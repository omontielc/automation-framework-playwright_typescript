name: Playwright Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    # Injected once for the whole job, available to every step below,
    # since env.ts requires these variables to be present via process.env
    env:
      BASE_URL_UI_SAUCE: ${{ secrets.BASE_URL_UI_SAUCE }}
      BASE_URL_UI_BLAZE: ${{ secrets.BASE_URL_UI_BLAZE }}
      BASE_URL_API: ${{ secrets.BASE_URL_API }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install Playwright browsers
      run: npx playwright install --with-deps
    
    - name: Run tests - UI
      run: npm run test:ui
      continue-on-error: true
    
    - name: Run tests - API
      run: npm run test:api
      continue-on-error: true

    - name: Generate Allure Report
      if: always()
      run: |
        npx allure generate allure-results --clean -o allure-report

    - name: Upload Allure Report Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-report
        path: allure-report
        retention-days: 30

    - name: Upload Playwright Report Artifact for Pages
      uses: actions/upload-pages-artifact@v3
      if: always()
      with:
        path: playwright-report/
    
    - name: Comment PR with results
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: